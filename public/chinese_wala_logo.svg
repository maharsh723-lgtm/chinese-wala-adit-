<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="cwBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4db3"/>
      <stop offset="100%" stop-color="#052c70"/>
    </linearGradient>
    <linearGradient id="cwGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff033"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="cwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean Container Background -->
  <rect width="500" height="160" rx="14" fill="#ffffff"/>

  <!-- Phone Header -->
  <text x="24" y="24" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Call : 70462 69068</text>

  <!-- Main Royal Blue Pill Banner -->
  <rect x="20" y="32" width="370" height="72" rx="14" fill="url(#cwBlueGrad)" filter="url(#cwShadow)"/>

  <!-- Chopsticks crossed over the C -->
  <line x1="36" y1="44" x2="68" y2="82" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="40" x2="74" y2="76" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- "CHINESE" Text -->
  <text x="56" y="82" font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="2">CHINESE</text>

  <!-- "वाला" Hindi Text in Golden Yellow -->
  <text x="282" y="82" font-family="'Mukta', 'Noto Sans Devanagari', 'Mangal', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="900" fill="url(#cwGoldGrad)">&#2357;&#2366;&#2354;&#2366;</text>

  <!-- Food Plate Illustration on Right -->
  <g transform="translate(405, 34)">
    <ellipse cx="40" cy="36" rx="40" ry="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="40" cy="36" rx="34" ry="28" fill="#e53935"/>
    <!-- Veggies & Paneer chunks in plate -->
    <rect x="24" y="24" width="12" height="12" rx="2" fill="#fff7ed"/>
    <rect x="42" y="20" width="14" height="13" rx="2" fill="#fff7ed"/>
    <rect x="34" y="38" width="13" height="13" rx="2" fill="#fff7ed"/>
    <circle cx="28" cy="42" r="5" fill="#22c55e"/>
    <circle cx="50" cy="38" r="4.5" fill="#22c55e"/>
    <circle cx="38" cy="22" r="4" fill="#fbbf24"/>
  </g>

  <!-- Sub-banner: Red CHINESE Pill -->
  <rect x="22" y="114" width="108" height="32" rx="8" fill="#e53935"/>
  <text x="76" y="136" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHINESE</text>

  <!-- Sub-banner: ADIT CAMPUS -->
  <text x="146" y="137" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="20" font-weight="900" fill="#052c70" letter-spacing="2">ADIT CAMPUS</text>
</svg>
